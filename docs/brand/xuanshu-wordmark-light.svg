    <text x="0" y="166" fill="#1E1E1E" font-family="Inter, Geist, 'IBM Plex Sans', Arial, sans-serif" font-size="64" font-weight="650" letter-spacing="0">XuanShu</text>
    <path d="M3 202H520" stroke="#D4D4D4" stroke-width="2"/>
    <text x="0" y="244" fill="#6B6B6B" font-family="Inter, Geist, 'IBM Plex Sans', Arial, sans-serif" font-size="28" font-weight="500" letter-spacing="0">Local Agent OS</text>
    <circle cx="246" cy="234" r="4" fill="#1F883D"/>
    <text x="266" y="244" fill="#6B6B6B" font-family="Inter, Geist, 'IBM Plex Sans', Arial, sans-serif" font-size="28" font-weight="500" letter-spacing="0">see, think, act</text>
