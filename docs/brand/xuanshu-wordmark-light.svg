    <path d="M78 76.7A100 100 0 0 1 150.5 42" stroke="url(#ring)" stroke-width="7" stroke-linecap="round"/>
    <path d="M210.7 61A100 100 0 0 1 246 141" stroke="url(#ring)" stroke-width="7" stroke-linecap="round"/>
    <path d="M227.7 208.4A100 100 0 0 1 150.5 250" stroke="url(#ring)" stroke-width="7" stroke-linecap="round"/>
    <path d="M83 224.7A100 100 0 0 1 46 153.6" stroke="url(#ring)" stroke-width="7" stroke-linecap="round"/>
    <path d="M100 101L192 193" stroke="#FFFFFF" stroke-width="26" stroke-linecap="round"/>
    <path d="M193 101L99 193" stroke="#FFFFFF" stroke-width="26" stroke-linecap="round"/>
    <path d="M100 101L192 193" stroke="url(#axis)" stroke-width="15" stroke-linecap="round"/>
    <path d="M193 101L99 193" stroke="url(#axis)" stroke-width="15" stroke-linecap="round"/>
    <circle cx="146" cy="146" r="38" fill="#FFFFFF" stroke="#D4D4D4" stroke-width="7"/>
    <circle cx="146" cy="146" r="24" fill="#0067B8"/>
    <circle cx="146" cy="146" r="8" fill="#FFFFFF"/>
