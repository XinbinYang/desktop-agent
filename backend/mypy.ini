[mypy]
python_version = 3.11
ignore_missing_imports = True
warn_return_any = False
warn_unused_ignores = False
show_error_codes = True

# Tool execute(**kwargs) subclasses use specific parameter lists intentionally
# — the dispatch path in message_utils.execute_tool() unpacks **tool_args, so
# the override is safe by construction. Suppressing these avoids ~40
# per-file ignore comments.
disable_error_code = override

# Files that import Windows-only deps (pywin32, pywinauto) — skip them on
# non-Windows to avoid false positives.
[mypy-app.tools.app_tool]
ignore_errors = True

# Optional heavy deps that may not be installed in all dev environments.
[mypy-app.backtest_engine]
ignore_errors = True

[mypy-app.tools.backtest_tool]
ignore_errors = True
