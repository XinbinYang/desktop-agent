<svg width="1280" height="360" viewBox="0 0 1280 360" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">XuanShu horizontal wordmark on light background</title>
  <desc id="desc">The XuanShu logo lockup adapted for light surfaces.</desc>
  <defs>
    <linearGradient id="axis" x1="68" y1="60" x2="220" y2="224" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0969DA"/>
      <stop offset="0.48" stop-color="#0067B8"/>
      <stop offset="1" stop-color="#005A9E"/>
    </linearGradient>
    <linearGradient id="ring" x1="44" y1="40" x2="244" y2="252" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0969DA"/>
      <stop offset="0.52" stop-color="#0067B8"/>
      <stop offset="1" stop-color="#005A9E"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="360" rx="42" fill="#FFFFFF"/>
  <rect x="1" y="1" width="1278" height="358" rx="41" stroke="#D4D4D4" stroke-width="2"/>

  <g transform="translate(60 34)">
    <rect width="292" height="292" rx="68" fill="#F3F3F3"/>
