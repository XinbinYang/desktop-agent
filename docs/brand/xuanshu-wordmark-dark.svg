<svg width="1280" height="360" viewBox="0 0 1280 360" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">XuanShu horizontal wordmark on dark background</title>
  <desc id="desc">The XuanShu logo lockup with the central-axis icon, Chinese name, English name, and positioning line.</desc>
  <defs>
