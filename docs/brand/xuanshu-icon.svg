<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">XuanShu icon</title>
  <desc id="desc">A dark app icon with an abstract central axis, broken orbital rings, and a subtle X-shaped control core.</desc>
  <defs>
    <linearGradient id="xuanshu-axis" x1="132" y1="124" x2="386" y2="394" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#9ECBFF"/>
      <stop offset="0.45" stop-color="#58A6FF"/>
      <stop offset="1" stop-color="#388BFD"/>
    </linearGradient>
    <linearGradient id="xuanshu-ring" x1="94" y1="82" x2="424" y2="430" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#79C0FF"/>
      <stop offset="0.52" stop-color="#58A6FF"/>
      <stop offset="1" stop-color="#388BFD"/>
    </linearGradient>
    <radialGradient id="xuanshu-core" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(256 256) rotate(90) scale(58)">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.28" stop-color="#D2E8FF"/>
      <stop offset="0.72" stop-color="#58A6FF"/>
      <stop offset="1" stop-color="#3FB950"/>
    </radialGradient>
    <filter id="xuanshu-glow" x="72" y="72" width="368" height="368" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feColorMatrix in="blur" type="matrix" values="0 0 0 0 0.345 0 0 0 0 0.651 0 0 0 0 1 0 0 0 0.38 0"/>
      <feBlend in="SourceGraphic" mode="screen"/>
    </filter>
  </defs>

